{% extends 'base.html' %}

{% block title %}Server Error — JobTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg rounded-4 p-5">
            <h1 class="display-1 fw-extrabold text-danger mb-3">500</h1>
            <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
            <p class="text-secondary mb-4">Something went wrong on our end. Please try again later.</p>
            <div>
                <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
