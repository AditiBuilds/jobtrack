{% extends 'base.html' %}

{% block title %}Page Not Found — JobTrack{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-lg rounded-4 p-5">
            <h1 class="display-1 fw-extrabold text-primary mb-3">404</h1>
            <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
            <p class="text-secondary mb-4">The application or page you are looking for does not exist or you do not have permission to access it.</p>
            <div>
                <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
